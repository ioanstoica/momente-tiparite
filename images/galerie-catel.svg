    <path id="hair" d="M-34-186C-36-212-16-222 2-221C22-220 37-206 34-186C30-197 20-203 8-204C2-196-12-194-22-197C-27-194-31-191-34-186Z" style="fill:var(--hair)"/>
    <g id="dog">

      <rect x="-30" y="-32" width="11" height="31" rx="5.5" style="fill:var(--fur)"/>
      <rect x="14" y="-32" width="11" height="31" rx="5.5" style="fill:var(--fur)"/>
      <ellipse cx="-4" cy="-40" rx="37" ry="20" style="fill:var(--fur)"/>
      <ellipse cx="-6" cy="-34" rx="20" ry="9" style="fill:var(--fur2)" opacity=".6"/>
      <circle cx="30" cy="-64" r="21" style="fill:var(--fur)"/>
      <ellipse cx="18" cy="-68" rx="8" ry="16" transform="rotate(22 18 -68)" style="fill:var(--fur2)"/>
      <ellipse cx="44" cy="-57" rx="10" ry="7.5" fill="#FFF6EA"/>
      <circle cx="51" cy="-60" r="4" fill="#2B211C"/>
      <circle cx="35" cy="-69" r="3" fill="#2B211C"/>
      <path d="M8-50Q30-40 46-48" fill="none" stroke="#9B2F3F" stroke-width="5" stroke-linecap="round"/>

      <circle cx="-20" cy="-171" r="5.5" opacity=".5" style="fill:var(--cheek,#E8998D)"/>
      <circle cx="20" cy="-171" r="5.5" opacity=".5" style="fill:var(--cheek,#E8998D)"/>
      <path d="M-8-169Q0-162 8-169" fill="none" stroke-width="2.6" stroke-linecap="round" style="stroke:var(--eye,#2B211C)"/>
    </g>
    <path id="hair" d="M-34-186C-36-212-16-222 2-221C22-220 37-206 34-186C30-197 20-203 8-204C2-196-12-194-22-197C-27-194-31-191-34-186Z" style="fill:var(--hair)"/>
    <circle id="bun" cx="0" cy="-222" r="14" style="fill:var(--hair)"/>

  <rect width="400" height="500" fill="url(#bg)"/>
  <g fill="#B8924A">
    <use href="#spark" x="58" y="84" opacity=".5"/>
    <use href="#spark" x="344" y="96" opacity=".4"/>
    <use href="#spark" x="200" y="150" opacity=".35"/>
    <use href="#spark" x="40" y="236" opacity=".3"/>

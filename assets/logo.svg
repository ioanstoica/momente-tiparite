<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Momente Imprimate</title>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123457"/>
      <stop offset="100%" stop-color="#071a2e"/>
    </linearGradient>
    <linearGradient id="stripe-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc25c"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <clipPath id="bottle-clip">
      <rect x="20" y="17" width="24" height="35" rx="9"/>
    </clipPath>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#bg-grad)"/>

  <!-- bottle neck -->
  <rect x="27.5" y="8" width="9" height="11" rx="2.5" fill="#ffffff"/>
  <!-- cap -->
  <rect x="26" y="4" width="12" height="7" rx="3" fill="url(#stripe-grad)"/>
  <!-- carabiner ring -->
  <circle cx="20" cy="10" r="3.6" fill="none" stroke="url(#stripe-grad)" stroke-width="1.8"/>
  <path d="M22.8 11 L26.5 8.5" stroke="url(#stripe-grad)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- bottle body -->
  <rect x="20" y="17" width="24" height="35" rx="9" fill="#ffffff"/>

  <!-- sublimation print stripe, clipped to bottle body -->
  <g clip-path="url(#bottle-clip)">
    <polygon points="14,44 34,17 50,17 30,58 14,58" fill="url(#stripe-grad)"/>
    <polygon points="30,58 50,17 58,17 42,58" fill="#2fb8c4" opacity="0.85"/>
  </g>
</svg>
